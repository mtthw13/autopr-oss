# Auto-generated by `autopr init`. Reconciles open managed PRs on push to the base branch.
name: autopr-reconcile

on:
  push:
    branches: [__AUTOPR_BASE_BRANCH__]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: autopr-reconcile
  cancel-in-progress: true

env:
  GIT_AUTHOR_NAME: "autopr[bot]"
  GIT_AUTHOR_EMAIL: "autopr[bot]@users.noreply.github.com"
  GIT_COMMITTER_NAME: "autopr[bot]"
  GIT_COMMITTER_EMAIL: "autopr[bot]@users.noreply.github.com"

jobs:
  reconcile:
    name: Reconcile open managed PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          repository: __AUTOPR_TOOL_REPO__
          token: ${{ secrets.AUTOPR_TOOL_TOKEN || secrets.GITHUB_TOKEN }}
          ref: __AUTOPR_TOOL_REF__
          path: .autopr-tool

      - name: Install autopr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.autopr-tool

      - name: Run autopr reconcile-open-prs
        run: |
          autopr reconcile-open-prs . --base-branch __AUTOPR_BASE_BRANCH__
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
