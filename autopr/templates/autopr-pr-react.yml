# Auto-generated by `autopr init`. Reacts to PR events on autopr-managed branches.
name: autopr-pr-react

on:
  workflow_run:
    workflows: [__AUTOPR_CI_WORKFLOW_NAMES__]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

env:
  GIT_AUTHOR_NAME: "autopr[bot]"
  GIT_AUTHOR_EMAIL: "autopr[bot]@users.noreply.github.com"
  GIT_COMMITTER_NAME: "autopr[bot]"
  GIT_COMMITTER_EMAIL: "autopr[bot]@users.noreply.github.com"

jobs:
  resolve-context:
    name: Resolve PR context
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_branch: ${{ steps.resolve.outputs.head_branch }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch and PR
        id: resolve
        run: |
          PR_NUM=""
          HEAD_BRANCH=""
          HEAD_SHA=""

          case "${{ github.event_name }}" in
            workflow_run)
              HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
              HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
              PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
              if [ -z "$PR_NUM" ] && [ -n "$HEAD_BRANCH" ]; then
                PR_NUM=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number')
              fi
              ;;
            pull_request_review|pull_request_review_comment)
              PR_NUM="${{ github.event.pull_request.number }}"
              HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            issue_comment)
              PR_NUM="${{ github.event.issue.number }}"
              PR_JSON=$(gh pr view "$PR_NUM" --json headRefName,headRefOid)
              HEAD_BRANCH=$(echo "$PR_JSON" | jq -r .headRefName)
              HEAD_SHA=$(echo "$PR_JSON" | jq -r .headRefOid)
              ;;
          esac

          if [ -z "$PR_NUM" ] || [ -z "$HEAD_BRANCH" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-failed:
    name: React to CI failure
    needs: resolve-context
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      needs.resolve-context.outputs.skip != 'true' &&
      startsWith(needs.resolve-context.outputs.head_branch, '__AUTOPR_BRANCH_PREFIX__')
    runs-on: ubuntu-latest
    concurrency:
      group: autopr-react-${{ needs.resolve-context.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          repository: __AUTOPR_TOOL_REPO__
          token: ${{ secrets.AUTOPR_TOOL_TOKEN || secrets.GITHUB_TOKEN }}
          ref: __AUTOPR_TOOL_REF__
          path: .autopr-tool

      - name: Install autopr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.autopr-tool

      - name: Guard — cumulative run count
        id: guard
        run: |
          COUNT=$(gh run list --branch "${{ needs.resolve-context.outputs.head_branch }}" \
            --workflow "${{ github.workflow }}" --json conclusion -q 'length')
          if [ "$COUNT" -ge "__AUTOPR_MAX_RUNS__" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run autopr react
        if: steps.guard.outputs.skip != 'true'
        run: |
          autopr react . \
            --event ci_failed \
            --pr ${{ needs.resolve-context.outputs.pr_number }} \
            --head-branch "${{ needs.resolve-context.outputs.head_branch }}" \
            --head-sha "${{ needs.resolve-context.outputs.head_sha }}" \
            --check-name "${{ github.event.workflow_run.name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  review-submitted:
    name: React to review
    needs: resolve-context
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      needs.resolve-context.outputs.skip != 'true' &&
      startsWith(needs.resolve-context.outputs.head_branch, '__AUTOPR_BRANCH_PREFIX__') &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: autopr-react-${{ needs.resolve-context.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          repository: __AUTOPR_TOOL_REPO__
          token: ${{ secrets.AUTOPR_TOOL_TOKEN || secrets.GITHUB_TOKEN }}
          ref: __AUTOPR_TOOL_REF__
          path: .autopr-tool

      - name: Install autopr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.autopr-tool

      - name: Run autopr react
        run: |
          autopr react . \
            --event review_submitted \
            --pr ${{ needs.resolve-context.outputs.pr_number }} \
            --head-branch "${{ needs.resolve-context.outputs.head_branch }}" \
            --head-sha "${{ needs.resolve-context.outputs.head_sha }}" \
            --review-id ${{ github.event.review.id }} \
            --comment-body "${{ github.event.review.body }}" \
            --created-at "${{ github.event.review.submitted_at }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  review-comment:
    name: React to review comment
    needs: resolve-context
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      needs.resolve-context.outputs.skip != 'true' &&
      startsWith(needs.resolve-context.outputs.head_branch, '__AUTOPR_BRANCH_PREFIX__') &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: autopr-react-${{ needs.resolve-context.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          repository: __AUTOPR_TOOL_REPO__
          token: ${{ secrets.AUTOPR_TOOL_TOKEN || secrets.GITHUB_TOKEN }}
          ref: __AUTOPR_TOOL_REF__
          path: .autopr-tool

      - name: Install autopr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.autopr-tool

      - name: Run autopr react
        run: |
          autopr react . \
            --event review_comment \
            --pr ${{ needs.resolve-context.outputs.pr_number }} \
            --head-branch "${{ needs.resolve-context.outputs.head_branch }}" \
            --head-sha "${{ needs.resolve-context.outputs.head_sha }}" \
            --comment-body "${{ github.event.comment.body }}" \
            --comment-id ${{ github.event.comment.id }} \
            --comment-author "${{ github.event.comment.user.login }}" \
            --created-at "${{ github.event.comment.created_at }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  pr-comment:
    name: React to PR comment (__AUTOPR_COMMENT_COMMAND__)
    needs: resolve-context
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '__AUTOPR_COMMENT_COMMAND__') &&
      needs.resolve-context.outputs.skip != 'true' &&
      startsWith(needs.resolve-context.outputs.head_branch, '__AUTOPR_BRANCH_PREFIX__')
    runs-on: ubuntu-latest
    concurrency:
      group: autopr-react-${{ needs.resolve-context.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          repository: __AUTOPR_TOOL_REPO__
          token: ${{ secrets.AUTOPR_TOOL_TOKEN || secrets.GITHUB_TOKEN }}
          ref: __AUTOPR_TOOL_REF__
          path: .autopr-tool

      - name: Install autopr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.autopr-tool

      - name: Run autopr react
        run: |
          autopr react . \
            --event pr_comment \
            --pr ${{ needs.resolve-context.outputs.pr_number }} \
            --head-branch "${{ needs.resolve-context.outputs.head_branch }}" \
            --head-sha "${{ needs.resolve-context.outputs.head_sha }}" \
            --comment-body "${{ github.event.comment.body }}" \
            --comment-id ${{ github.event.comment.id }} \
            --comment-author "${{ github.event.comment.user.login }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
