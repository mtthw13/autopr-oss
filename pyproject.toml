[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopr"
version = "0.1.0"
description = "Autonomous PR generation system using Claude Code CLI"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Matthew Liew"}
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "gitpython>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-picked>=0.5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[project.scripts]
autopr = "autopr.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["autopr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["autopr"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 55
